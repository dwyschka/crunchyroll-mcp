services:
  mcp-crunchyroll:
    build: .
    container_name: mcp-crunchyroll-proxy
    restart: unless-stopped
    ports:
      - "8808:8808"
    environment:
      - CRUNCHYROLL_EMAIL=${CRUNCHYROLL_EMAIL}
      - CRUNCHYROLL_PASSWORD=${CRUNCHYROLL_PASSWORD}
      - CRUNCHYROLL_LOCALE=${CRUNCHYROLL_LOCALE:-en-US}
      - CRUNCHYROLL_AUDIO_LOCALE=${CRUNCHYROLL_AUDIO_LOCALE:-ja-JP}
      - DEV_MODE=${DEV_MODE:-false}
    volumes:
      - crunchyroll_session:/root/.crunchyroll-mcp

volumes:
  crunchyroll_session:
