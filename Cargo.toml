[package]
name = "crunchyroll-mcp"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "crunchyroll-mcp"
path = "src/main.rs"

[dependencies]
crunchyroll-rs = "0.19"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
dirs = "7"
uuid = { version = "1", features = ["v4"] }
futures-util = "0.3"
