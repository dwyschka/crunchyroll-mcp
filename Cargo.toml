[package]
name = "crunchyroll-mcp"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "crunchyroll-mcp"
path = "src/main.rs"

[dependencies]
crunchyroll-rs = { version = "0.19", features = ["middleware"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
dirs = "7"
uuid = { version = "1", features = ["v4"] }
futures-util = "0.3"
reqwest = { version = "0.13", default-features = false }
http = "1"
form_urlencoded = "1"
tower-service = "0.3"
